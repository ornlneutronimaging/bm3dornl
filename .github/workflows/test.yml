name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main, next, qa]
  push:
    branches: [main, next, qa]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust_core

      - name: Run Rust tests (excluding GUI)
        working-directory: src/rust_core
        run: |
          # Test bm3d_core only (GUI requires HDF5, Python bindings require Python)
          cargo test -p bm3d_core --release

  rust-lint:
    name: Rust Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Lint on both x86_64 and aarch64 so the arch-gated SIMD paths are all
        # covered: SSE2/AVX2 compile only on x86, NEON only on aarch64. A single-arch
        # gate let the edition-2024 unsafe_op_in_unsafe_fn break hide on x86. See #109.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust_core

      - name: Check formatting
        working-directory: src/rust_core
        run: cargo fmt --all -- --check

      - name: Run clippy (entire workspace)
        working-directory: src/rust_core
        # Lint every crate (bm3d_core, bm3d_python, bm3d_gui_egui), not just bm3d_core.
        run: cargo clippy --workspace --all-targets -- -D warnings

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.62.2
          run-install: false

      - name: Install dependencies (skip local package)
        run: pixi install --frozen --skip bm3dornl

      - name: Install local package
        run: pixi run pip install --no-deps -e .

      - name: Build and test
        run: |
          pixi run build
          pixi run test-python
