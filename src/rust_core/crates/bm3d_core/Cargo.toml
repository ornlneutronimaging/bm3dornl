[package]
name = "bm3d_core"
version.workspace = true
edition.workspace = true
description = "Pure Rust BM3D denoising algorithm core"
license = "MIT"
repository = "https://github.com/ornlneutronimaging/bm3dornl"
readme = "README.md"
keywords = ["image-processing", "denoising", "bm3d", "noise-reduction", "scientific-computing"]
categories = ["multimedia::images", "science"]
authors = ["Oak Ridge National Laboratory Neutron Imaging Team"]

[lib]
name = "bm3d_core"
crate-type = ["rlib"]

[features]
default = []
# BM3D passes through heterocompute, on the CPU, a CUDA GPU or an Apple GPU.
heterocompute = ["dep:heterocompute"]
# As `heterocompute`, linking the system OpenBLAS its CPU services need on Linux.
heterocompute-openblas = ["heterocompute", "heterocompute/openblas"]

[dependencies]
heterocompute = { git = "ssh://git@github.com/KedoKudo/heterocompute.git", rev = "42c7eba0d60b8b163aacfb8f92ce16cf5b1e24c7", optional = true }
ndarray = { workspace = true }
num-traits = "0.2"
rayon = { workspace = true }
rustfft = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
libc = "0.2"
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "bm3d_benchmarks"
harness = false
